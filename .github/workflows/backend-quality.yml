name: Backend quality checks

on:
  push:
    branches: [main, audit/2026-11-quality-improvements]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run order status tests
        run: npm test
      - name: Check backend JavaScript syntax
        run: find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
